<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ekRank Teacher App product film</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0a0f1e; }
  body { display: grid; place-items: center; overflow: hidden; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  .film { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #0a0f1e; }
  .frame { position: absolute; inset: 0; display: grid; place-items: center; padding: 3.5vw; opacity: 0; transition: opacity 420ms ease; pointer-events: none; }
  .frame.is-active { opacity: 1; }
  .frame img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 14px; box-shadow: 0 24px 80px rgb(0 0 0 / 35%); }
  .caption { position: absolute; left: 5%; right: 5%; bottom: 5%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; border: 1px solid rgb(255 255 255 / 16%); border-radius: 12px; background: rgb(10 15 30 / 78%); backdrop-filter: blur(14px); color: #fff; font-size: clamp(12px, 1.7vw, 16px); }
  .caption strong { font-weight: 700; }
  .progress { display: flex; gap: 6px; flex: 0 0 auto; }
  .dot { width: 7px; height: 7px; border: 0; padding: 0; border-radius: 50%; background: rgb(255 255 255 / 35%); cursor: pointer; }
  .dot.is-active { background: #c34bd6; box-shadow: 0 0 0 3px rgb(195 75 214 / 18%); }
  @media (prefers-reduced-motion: reduce) { .frame { transition: none; } }
</style>
</head>
<body>
<main class="film" aria-label="ekRank Teacher App product film">
  <figure class="frame is-active"><img src="../../../../screenshots/web/01-t.png" alt="Teacher App home dashboard"><figcaption class="caption"><strong>Start the school day with clarity.</strong><span class="progress"><button class="dot is-active" aria-label="Show frame 1"></button><button class="dot" aria-label="Show frame 2"></button><button class="dot" aria-label="Show frame 3"></button><button class="dot" aria-label="Show frame 4"></button><button class="dot" aria-label="Show frame 5"></button></span></figcaption></figure>
  <figure class="frame"><img src="../../../../screenshots/web/create-exam.png" alt="Create an exam from the syllabus"></figure>
  <figure class="frame"><img src="../../../../screenshots/web/02-t.png" alt="Monitor a live exam"></figure>
  <figure class="frame"><img src="../../../../screenshots/web/03-t.png" alt="Review exam results"></figure>
  <figure class="frame"><img src="../../../../screenshots/web/06-t.png" alt="Choose chapters and topics for reteaching"></figure>
  <figure class="frame"><img src="../../../../screenshots/web/07-t.png" alt="Review exam performance"></figure>
  <figure class="frame"><img src="../../../../screenshots/web/insights.png" alt="View class insights and average scores"></figure>
  <figure class="frame"><img src="../../../../screenshots/web/needs-your-focus.png" alt="See students who need focused practice"></figure>
  <figure class="frame"><img src="../../../../screenshots/web/question-bank.png" alt="Browse the question bank"></figure>
</main>
<script>
(() => {
  const frames = [...document.querySelectorAll('.frame')];
  const dots = [...document.querySelectorAll('.dot')];
  let index = 0;
  let timer;
  const show = (next) => {
    index = (next + frames.length) % frames.length;
    frames.forEach((frame, i) => frame.classList.toggle('is-active', i === index));
    dots.forEach((dot, i) => dot.classList.toggle('is-active', i === index));
  };
  const restart = () => { window.clearInterval(timer); timer = window.setInterval(() => show(index + 1), 4200); };
  dots.forEach((dot, i) => dot.addEventListener('click', () => { show(i); restart(); }));
  restart();
})();
</script>
</body>
</html>
